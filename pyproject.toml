[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "kalshi-sports-intelligence"
version = "0.1.0"
description = "Auditable winner-market probability research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.4,<2"]
[tool.setuptools.packages.find]
where = ["src"]
