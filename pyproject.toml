[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "kalshi-sports-probability-lab"
version = "0.2.0"
description = "Auditable NBA winner-market research and automated public quote monitoring"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.4,<2"]
[tool.setuptools.packages.find]
where = ["src"]
